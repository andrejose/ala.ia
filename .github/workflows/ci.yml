# Integração contínua do Ala.ia
#
# A cada pull request e a cada push na main:
#   - backend:  sobe o Supabase local no runner (Docker), aplica as migrations,
#               roda os testes do banco (pgTAP) e os de integração (Vitest + supertest);
#   - frontend: checa os tipos (TypeScript), roda os testes (Vitest +
#               Testing Library, com a API simulada pelo MSW) e faz o build (Vite).
#   - docker:   monta a imagem de produção (a mesma do Coolify) e confere se
#               ela sobe saudável, com a API e as telas no mesmo endereço.
#
# Nada aqui usa o projeto Supabase remoto nem segredos do repositório.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo no mesmo PR cancela a execução anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes de integração)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      # Os testes só usam banco, autenticação (gotrue), API REST (postgrest) e o
      # gateway (kong); o resto fica desligado para o CI subir mais rápido.
      - name: Sobe o Supabase local e aplica as migrations
        run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # RLS, triggers, constraints e funções testados direto no Postgres
      - name: Roda os testes do banco (pgTAP)
        run: npm run test:db

      - name: Cria o .env.test com os dados do Supabase local
        run: |
          npx supabase status -o env > supabase-status.env
          api_url=$(grep '^API_URL=' supabase-status.env | cut -d= -f2- | tr -d '"')
          key=$(grep '^PUBLISHABLE_KEY=' supabase-status.env | cut -d= -f2- | tr -d '"')
          if [ -z "$api_url" ] || [ -z "$key" ]; then
            echo "::error::Não foi possível ler API_URL e PUBLISHABLE_KEY de 'supabase status'"
            cat supabase-status.env
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$api_url" "$key" > .env.test

      - name: Roda os testes
        run: npm test

      - name: Mostra os logs do Supabase se algo falhar
        if: failure()
        run: docker ps -a && docker logs supabase_auth_backend --tail 100 || true

      - name: Para o Supabase
        if: always()
        run: npx supabase stop --no-backup

  # O nome do job (abaixo) é o check obrigatório da main; mudar o nome exige
  # atualizar a proteção da branch no GitHub.
  frontend:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências
        run: npm ci

      - name: Checa os tipos
        run: npm run typecheck

      - name: Roda os testes
        run: npm test

      - name: Faz o build
        run: npm run build

  docker:
    name: Imagem Docker (build e saúde)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # A mesma imagem que o Coolify monta para publicar
      - name: Monta a imagem
        run: docker build -t ala-ia:ci .

      # Sobe o contêiner (com um Supabase de mentira: só /health e as telas são
      # conferidos, sem falar com o banco) e espera ficar saudável
      - name: Sobe o contêiner e confere a saúde, a API e as telas
        run: |
          docker run -d --name ala -p 3001:3001 \
            -e SUPABASE_URL=http://supabase.invalid \
            -e SUPABASE_PUBLISHABLE_KEY=ci \
            ala-ia:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3001/api/health
          curl -fsS -H "Accept: text/html" http://localhost:3001/lancamentos | grep -q '<div id="root">'
          curl -fsSI http://localhost:3001/ | grep -qi "content-security-policy"

      # O Coolify pode passar outra PORT: o HEALTHCHECK da imagem precisa seguir a variável
      - name: Confere o HEALTHCHECK com outra PORT
        run: |
          docker run -d --name ala-porta -e PORT=3000             -e SUPABASE_URL=http://supabase.invalid             -e SUPABASE_PUBLISHABLE_KEY=ci             ala-ia:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format "{{.State.Health.Status}}" ala-porta)
            if [ "$status" != "starting" ]; then break; fi
            sleep 3
          done
          echo "Saúde do contêiner com PORT=3000: $status"
          test "$status" = "healthy"

      - name: Mostra os logs do contêiner se algo falhar
        if: failure()
        run: |
          docker logs ala || true
          docker logs ala-porta || true
